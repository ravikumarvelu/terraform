#cloud-config
package_update: true
packages:
  - nginx
runcmd:
  - systemctl enable --now nginx
  - |
    cat > /var/www/html/index.nginx-debian.html <<'EOF'
    <html>
      <body>
        <h1>Terraform Azure Demo</h1>
        <p>Storage account: ${storage_account_name}</p>
        <p>Container: ${container_name}</p>
      </body>
    </html>
    EOF
